{% comment %}HTMX polling fragment for comparison progress page.{% endcomment %}
<div id="progress-poll"
 hx-get="{% url 'comparison-run-status' run.pk %}"
 hx-trigger="every 2500ms"
 hx-target="#progress-poll"
 hx-swap="outerHTML"
>
 <div style="display:flex;flex-direction:column;gap:8px;align-items:center;">
 {% if run.total_pairs %}
 <div style="width:100%;height:6px;background:#ffffff;border-radius:3px;overflow:hidden;">
 <div style="height:100%;width:{{ run.progress_pct }}%;background:#002583;border-radius:3px;transition:width .5s;"></div>
 </div>
 <p style="font-size:11px;color:#002583;margin:0;">
 {{ run.completed_pairs }} / {{ run.total_pairs }} pairs
 </p>
 {% else %}
 <p style="font-size:11px;color:#002583;animation:pulse 1.5s ease-in-out infinite;margin:0;">
 Connecting to AI…
 </p>
 {% endif %}
 </div>
</div>
