{% comment %}Contextual wizard banner — §7. Dismissible. Set banner_color/banner_title/banner_body in page context.{% endcomment %}
{% if banner_title %}
<div x-data="{ show: !localStorage.getItem('banner_dismissed_{{ request.resolver_match.url_name }}') }"
 x-show="show"
 x-transition
 class="mx-6 mt-4 rounded-lg px-4 py-3 flex items-start justify-between gap-4 flex-shrink-0"
 style="background-color: {{ banner_color|default:'#002583' }}1A; border: 1px solid {{ banner_color|default:'#002583' }}40;">

 <div class="flex gap-3 items-start min-w-0">
 <div class="w-1 self-stretch rounded-full flex-shrink-0" style="background-color: {{ banner_color|default:'#002583' }};"></div>
 <div>
 <p class="text-xs font-bold" style="color: {{ banner_color|default:'#002583' }};">{{ banner_title }}</p>
 <p class="text-xs text-gray-600 mt-0.5">{{ banner_body }}</p>
 </div>
 </div>

 <button @click="show = false; localStorage.setItem('banner_dismissed_{{ request.resolver_match.url_name }}', '1')"
 class="text-gray-400 hover:text-gray-600 flex-shrink-0 mt-0.5">
 <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor">
 <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
 </svg>
 </button>

</div>
{% endif %}
