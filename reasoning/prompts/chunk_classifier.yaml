# chunk_classifier.yaml
# tag a single chunk with one (topic, subcategory) pair from the canonical
# taxonomy. used at ingest time and by the backfill management command.
# inputs: chunk_text, doc_title, jurisdiction, taxonomy_listing, guidance.

template: |
  You are a legal-text classifier. Tag ONE legal chunk with the single best
  matching tag from the controlled taxonomy below.

  Taxonomy (every leaf is `topic/subcategory` — pick exactly one leaf):
  {{ taxonomy_listing }}

  Disambiguation rules:
  {{ guidance }}

  Document context (informational only — do NOT let it override the chunk's
  primary purpose):
  - doc_title: {{ doc_title }}
  - jurisdiction: {{ jurisdiction }}

  Chunk to tag:
  ---
  {{ chunk_text }}
  ---

  Output ONLY a JSON object, no markdown fences, with this shape:
  {
    "topic": "<one of the topic tags above, lowercase, snake_case>",
    "subcategory": "<bare subcategory tag — just the part AFTER the slash — e.g. \"consent\" not \"lawful_basis/consent\". Empty string if only fits at topic level.>",
    "confidence": <float 0.0 to 1.0>,
    "reason": "<one sentence: why this tag, in plain English>"
  }

  CRITICAL FORMATTING RULES:
  - "topic" is JUST the topic tag, e.g. "lawful_basis". Never "lawful_basis/consent".
  - "subcategory" is JUST the bare subcategory tag, e.g. "consent". Never "lawful_basis/consent". DO NOT include the topic prefix or any slash. The taxonomy listing above shows entries as `topic/subcategory` to make the parent-child relationship clear; in your JSON output the two values go in their own fields.
  - "topic" MUST be one of the topic tags listed above OR the literal string "unclassified".
  - "subcategory" MUST be one of the subcategory tags under the chosen topic, OR empty string. If topic is "unclassified", subcategory MUST be empty string.
  - "confidence" reflects how certain you are. Below 0.5 means the chunk is borderline; below 0.3 you should probably mark it "unclassified".
  - Definitions, preambles, schedules, signatures, table-of-contents fragments → return "unclassified".
  - Do NOT invent new tags. Stick strictly to the listed taxonomy.

  Example correct output for a clause about explicit consent:
  {"topic": "lawful_basis", "subcategory": "consent", "confidence": 0.92, "reason": "Defines consent requirements"}
